[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fleettrack-analytics"
version = "1.0.0"
description = "Logistics shipment and delivery performance analytics using PostgreSQL, Python and MongoDB"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "backend"]
testpaths = ["tests"]
